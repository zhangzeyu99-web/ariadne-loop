[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loops-assistant"
version = "0.3.0"
description = "Generate verifiable Loop Engineering specs and AI-ready execution packets from project or thread snapshots."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
license = { text = "MIT" }
keywords = ["ai-agents", "loop-engineering", "workflow", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
loops-assistant = "loops_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loops_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
